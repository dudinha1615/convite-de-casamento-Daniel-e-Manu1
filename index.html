
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convite Daniel & Manu</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9e7df;
    font-family:Georgia, serif;
}

.convite{
    width:360px;
    height:620px;
    position:relative;
    overflow:hidden;
    border-radius:28px;
    border:4px solid rgba(255,255,255,0.85);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.convite::before{
    content:"";
    position:absolute;
    inset:0;
    background:url("download\ \(9\).png") center center/cover no-repeat;
    z-index:0;
}

.convite::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.12);
    z-index:1;
}

.conteudo{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:35px;
}

.kit{
    font-size:58px;
    font-style:italic;
    color:#48613a;
    margin-bottom:8px;
}

.frase{
    font-size:11px;
    font-weight:bold;
    line-height:1.4;
    color:#444;
    max-width:260px;
}

.nomes{
    margin-top:20px;
    font-size:40px;
    font-style:italic;
    color:#48613a;
}

.texto{
    margin-top:5px;
    font-size:14px;
    letter-spacing:4px;
    color:#666;
}

.data{
    margin-top:18px;
    font-size:22px;
    font-weight:bold;
    color:#48613a;
    line-height:1.4;
}

.local{
    margin-top:28px;
}

.local h2{
    font-size:18px;
    color:#48613a;
    margin-bottom:5px;
}

.local p{
    font-size:12px;
    font-weight:bold;
    line-height:1.5;
    color:#444;
}

.icones{
    margin-top:30px;
    display:flex;
    gap:12px;
}

.icones a{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#48613a;
    color:white;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
}

.icones a:hover{
    transform:scale(1.1);
}

.icones i{
    font-size:15px;
}

</style>
</head>

<body>

<div class="convite">

    <div class="conteudo">

        <div class="kit">D | M</div>

        <div class="frase">
            “DEUS UNIU NOSSOS CAMINHOS E NÓS,<br>
            UNIREMOS NOSSAS VIDAS PARA SEMPRE.”
        </div>

        <div class="nomes">Daniel & Manu</div>

        <div class="texto">CASAMENTO</div>

        <div class="data">
            23 DE AGOSTO<br>
            CERIMÔNIA ÀS 11H
        </div>

        <div class="local">
            <h2>LOCAL</h2>
            <p>
                Recanto Alegria Plena<br>
                Av. Europa - Bairro Piza<br>
                Londrina - PR
            </p>
        </div>

        <div class="icones">

            <a href="https://www.google.com/maps/search/?api=1&query=Recanto%20Alegria%20Plena%20Avenida%20Europa%20Bairro%20Piza%20Londrina%20PR"
               target="_blank">
                <i class="fa-solid fa-location-dot"></i>
            </a>

            <a href="https://wa.me/5543984420862">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

            <a href="https://wa.me/5543984420862?text=Confirmo+presença">
                <i class="fa-solid fa-check"></i>
            </a>

        </div>

    </div>

</div>

</body>
</html>
